# =====================================================================
# CHINH SACH TUAN THU DANG MA (Compliance-as-Code) — 18 luat CIS
# ---------------------------------------------------------------------
# Moi luat = mot yeu cau an ninh (dua tren CIS Benchmark) duoc bieu dien
# thanh phep kiem chung tu dong. Day la "hop dong du lieu" so 2.
#
# Kieu kiem tra (check.type):
#   must_contain     : cau hinh BAT BUOC khop regex (co -> dat)
#   must_not_contain : cau hinh KHONG DUOC khop regex (khong co -> dat)
#
# Truong:
#   id          : ma luat (tham chieu CIS)
#   title       : mo ta ngan
#   severity    : high | medium | low  (dung de tinh diem co trong so)
#   applies_to  : all | srlinux | frr   (loc theo os cua thiet bi)
#   remediation : cach khac phuc (dua vao bao cao cho nguoi van hanh)
#   clo         : anh xa chuan dau ra hoc phan (phuc vu cham DATN)
# =====================================================================

weights:
  high: 5
  medium: 3
  low: 1

rules:
  # ==================== NHOM 1: TRUY CAP TU XA ====================
  - id: CIS-1.1
    title: "Cam dich vu Telnet (chi dung SSH)"
    severity: high
    applies_to: all
    check:
      type: must_not_contain
      pattern: '(?im)^\s*(telnet\s+server|service\s+telnet|transport\s+input\s+telnet)'
    remediation: "Xoa moi cau hinh telnet server; chi bat SSHv2."
    clo: [CLO2]

  - id: CIS-1.2
    title: "Bat buoc SSH phien ban 2"
    severity: high
    applies_to: all
    check:
      type: must_contain
      pattern: '(?im)^\s*(ssh\s+server|admin-state\s+enable.*ssh|ssh version 2|transport input ssh)'
    remediation: "Bat dich vu SSH va ep dung SSHv2."
    clo: [CLO2]

  # ==================== NHOM 2: SNMP ====================
  - id: CIS-2.1
    title: "Khong dung SNMP community mac dinh (public/private)"
    severity: high
    applies_to: all
    check:
      type: must_not_contain
      pattern: '(?im)community\s+(public|private)\b'
    remediation: "Xoa community public/private; chuyen sang SNMPv3."
    clo: [CLO2]

  - id: CIS-2.2
    title: "Bat SNMPv3 (xac thuc + ma hoa)"
    severity: medium
    applies_to: all
    check:
      type: must_contain
      pattern: '(?im)(snmp.*v3|usm.*auth.*priv|security-level\s+auth-priv)'
    remediation: "Cau hinh user SNMPv3 voi auth-priv (SHA/AES)."
    clo: [CLO2]

  # ==================== NHOM 3: BANNER ====================
  - id: CIS-3.1
    title: "Co banner canh bao truy cap (login banner)"
    severity: low
    applies_to: all
    check:
      type: must_contain
      pattern: '(?im)(banner|login-banner|message-of-the-day|motd)'
    remediation: "Them banner canh bao truy cap trai phep."
    clo: [CLO2]

  # ==================== NHOM 4: GHI NHAT KY ====================
  - id: CIS-4.1
    title: "Bat ghi nhat ky ra may chu syslog"
    severity: medium
    applies_to: all
    check:
      type: must_contain
      pattern: '(?im)(logging|log.*server|remote-server|syslog)'
    remediation: "Cau hinh gui log ve may chu syslog tap trung."
    clo: [CLO2, CLO3]

  - id: CIS-4.2
    title: "Dong bo thoi gian bang NTP"
    severity: low
    applies_to: all
    check:
      type: must_contain
      pattern: '(?im)(ntp|network-time)'
    remediation: "Cau hinh it nhat mot may chu NTP tin cay."
    clo: [CLO2]

  # ==================== NHOM 5: DINH TUYEN ====================
  - id: CIS-5.1
    title: "Xac thuc dinh tuyen (BGP/OSPF khong de trong mat khau)"
    severity: high
    applies_to: frr
    check:
      type: must_contain
      pattern: '(?im)(password|authentication|md5|neighbor .* password)'
    remediation: "Bat xac thuc cho phien dinh tuyen (MD5/keychain)."
    clo: [CLO2]

  # ==================== NHOM 6: KIEM SOAT TRUY CAP ====================
  - id: CIS-6.1
    title: "Gioi han truy cap quan tri bang ACL"
    severity: medium
    applies_to: all
    check:
      type: must_contain
      pattern: '(?im)(access-list|acl|ip access|match .* prefix)'
    remediation: "Chi cho phep dai quan tri 172.20.20.0/24 truy cap."
    clo: [CLO2]

  # ==================== NHOM 7: DICH VU MANG ====================
  - id: CIS-7.1
    title: "Tat HTTP server khong ma hoa"
    severity: medium
    applies_to: all
    check:
      type: must_not_contain
      pattern: '(?im)^\s*ip\s+http\s+server'
    remediation: "Tat dich vu HTTP, chi dung HTTPS cho quan tri web."
    clo: [CLO2]

  - id: CIS-7.2
    title: "Ma hoa mat khau luu trong cau hinh"
    severity: high
    applies_to: all
    check:
      type: must_contain
      pattern: '(?im)(service\s+password-encryption|password.*encrypted|hashed-password)'
    remediation: "Bat service password-encryption hoac dung secret."
    clo: [CLO2]

  # ==================== NHOM 8: PHIEN QUAN TRI ====================
  - id: CIS-8.1
    title: "Cau hinh timeout phien quan tri"
    severity: medium
    applies_to: all
    check:
      type: must_contain
      pattern: '(?im)(exec-timeout|idle-timeout|session.*timeout)'
    remediation: "Dat idle-timeout toi da 10 phut cho phien quan tri."
    clo: [CLO2]

  - id: CIS-8.2
    title: "Tat dich vu finger"
    severity: low
    applies_to: all
    check:
      type: must_not_contain
      pattern: '(?im)^\s*(service\s+finger|ip\s+finger)'
    remediation: "Tat dich vu finger (khong su dung)."
    clo: [CLO2]

  # ==================== NHOM 9: BAO MAT MANG ====================
  - id: CIS-9.1
    title: "Tat IP source-route"
    severity: high
    applies_to: frr
    check:
      type: must_contain
      pattern: '(?im)(no\s+ip\s+source-route|source-route.*disable)'
    remediation: "Them no ip source-route de chan gia mao tuyen duong."
    clo: [CLO2]

  - id: CIS-9.2
    title: "Bat logging cuc bo (buffer/file)"
    severity: low
    applies_to: all
    check:
      type: must_contain
      pattern: '(?im)(logging\s+buffer|log\s+file|log.*local|buffer-size)'
    remediation: "Bat logging buffer/file de luu nhat ky noi bo."
    clo: [CLO2, CLO3]

  # ==================== NHOM 10: MAT KHAU ====================
  - id: CIS-10.1
    title: "Khong luu mat khau dang ban ro (plaintext yeu)"
    severity: high
    applies_to: all
    check:
      type: must_not_contain
      pattern: '(?im)^\s*password\s+(admin|cisco|default|1234|password|test)\s*$'
    remediation: "Dung mat khau manh, khong de plaintext trong cau hinh."
    clo: [CLO2]

  - id: CIS-10.2
    title: "Bat buoc xac thuc dang nhap tren VTY"
    severity: high
    applies_to: frr
    check:
      type: must_contain
      pattern: '(?im)(line\s+(vty|con)[\s\S]*?login|login\s+local)'
    remediation: "Bat login local tren console va VTY."
    clo: [CLO2]

  # ==================== NHOM 11: DINH DANH ====================
  - id: CIS-11.1
    title: "Cau hinh hostname theo chuan dat ten"
    severity: low
    applies_to: all
    check:
      type: must_contain
      pattern: '(?im)(hostname|host-name)\s+\S+'
    remediation: "Dat hostname theo quy uoc dat ten cua to chuc."
    clo: [CLO1]
