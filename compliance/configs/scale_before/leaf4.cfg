! ============================================================
! GOLDEN CONFIG (mau) - leaf4 - Nokia SR Linux (access)
! Thiet bi CHUA hardening — co nhieu vi pham CIS de chung minh
! cong cu phat hien duoc. Sau hardening se khac phuc het.
! ============================================================
system {
    host-name leaf4
    ! Vi pham CIS-1.1: telnet server con bat
    telnet server {
        admin-state enable
    }
    ! Dat CIS-1.2: SSH bat
    ssh server {
        admin-state enable
    }
    ! Dat CIS-4.2: co NTP
    ntp {
        server 172.20.20.2
    }
    ! Dat CIS-4.1: co syslog
    logging {
        remote-server 172.20.20.3
    }
    ! Vi pham CIS-2.1: dung community public
    snmp {
        community public
    }
    ! Thieu banner (vi pham CIS-3.1)
    ! Thieu SNMPv3 (vi pham CIS-2.2)
    ! Thieu idle-timeout (vi pham CIS-8.1)
    ! Vi pham CIS-7.1: HTTP server bat
    ip http server
    ! Thieu password encryption (vi pham CIS-7.2)
    ! Thieu log file cuc bo (vi pham CIS-9.2)
}
interface ethernet-1/1 {
    admin-state enable
    subinterface 0 {
        ipv4 {
            address 10.0.34.2/30
        }
    }
}
interface mgmt0 {
    admin-state enable
    ! Dat CIS-6.1: co ACL quan tri
    ip access-list mgmt-in
}
! Khong co finger (dat CIS-8.2)
! Khong co mat khau mac dinh (dat CIS-10.1)
