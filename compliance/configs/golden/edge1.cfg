! ============================================================
! GOLDEN CONFIG (mau) - edge1 - FRRouting (border router)
! Thiet bi CHUA hardening — co vi pham CIS de chung minh
! cong cu phat hien duoc. Sau hardening se khac phuc het.
! ============================================================
!
! CIS-11.1: Hostname (dat)
hostname edge1
!
! CIS-1.2: SSH (dat) + CIS-10.2: login local (dat)
line vty
 transport input ssh
 login local
!
! CIS-4.2: NTP (dat)
ntp server 172.20.20.2
!
! CIS-5.1: Xac thuc BGP (dat)
router bgp 65000
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.1.2 remote-as 65010
 neighbor 10.0.1.2 password S3cur3BGP!
 neighbor 10.0.2.2 remote-as 65020
 neighbor 10.0.2.2 password S3cur3BGP!
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
!
! Thieu banner (vi pham CIS-3.1)
! Thieu SNMPv3 (vi pham CIS-2.2)
! Thieu service password-encryption (vi pham CIS-7.2)
! Thieu exec-timeout (vi pham CIS-8.1)
! Thieu no ip source-route (vi pham CIS-9.1)
! Thieu ACL (vi pham CIS-6.1)
! Thieu syslog/logging (vi pham CIS-4.1)
! Thieu log file cuc bo (vi pham CIS-9.2)
!
! CIS-1.1: Khong co telnet (dat)
! CIS-2.1: Khong co community public/private (dat)
! CIS-7.1: Khong co ip http server (dat)
! CIS-8.2: Khong co finger (dat)
! CIS-10.1: Khong co mat khau mac dinh (dat)
!
interface eth1
 ip address 10.0.1.1/30
!
interface eth2
 ip address 10.0.2.1/30
!
interface lo
 ip address 10.255.0.1/32
!
end
