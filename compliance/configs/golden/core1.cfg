! ============================================================
! GOLDEN CONFIG (mẫu để test) - core1 - FRRouting
! Thiết bị ĐÃ hardening theo CIS -> dùng để chứng minh công cụ
! cho điểm cao khi cấu hình đạt chuẩn.
! ============================================================
!
hostname core1
!
! CIS-1.2: chỉ dùng SSH v2 (telnet không cấu hình)
service integrated-vtysh-config
line vty
 transport input ssh
!
! CIS-3.1: banner cảnh báo
banner motd ^CCanh bao: He thong noi bo, cam truy cap trai phep.^C
!
! CIS-4.1: gửi log về syslog tập trung
log syslog informational
log file /var/log/frr/frr.log
!
! CIS-4.2: đồng bộ NTP
ntp server 172.20.20.2
!
! CIS-2.2: SNMPv3 auth-priv (không dùng community public/private)
snmp-server group v3group v3 priv
snmp-server user v3admin v3group auth sha AUTHKEY priv aes ENCKEY
!
! CIS-6.1: ACL giới hạn quản trị
access-list mgmt-in permit 172.20.20.0/24
!
! CIS-5.1: xác thực BGP
router bgp 65001
 neighbor 172.20.20.11 remote-as 65002
 neighbor 172.20.20.11 password S3cr3tBGPkey
!
line vty
 access-class mgmt-in in
!
end
