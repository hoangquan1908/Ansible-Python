! ============================================================
! GOLDEN CONFIG (mau) - spine1 - Nokia SR Linux (distribution)
! Thiet bi CHUA hardening — co nhieu vi pham CIS
! ============================================================
system {
    host-name spine1
    ! Vi pham CIS-1.1: telnet server con bat
    telnet server {
        admin-state enable
    }
    ! Dat CIS-1.2: SSH bat
    ssh server {
        admin-state enable
    }
    ! Dat CIS-4.2: co NTP
    ntp {
        server 172.20.20.2
    }
    ! Dat CIS-4.1: co syslog
    logging {
        remote-server 172.20.20.3
    }
    ! Vi pham CIS-2.1: dung community public
    snmp {
        community public
    }
    ! Thieu banner (vi pham CIS-3.1)
    ! Thieu SNMPv3 (vi pham CIS-2.2)
    ! Thieu idle-timeout (vi pham CIS-8.1)
    ! Thieu password encryption (vi pham CIS-7.2)
    ! Thieu log file cuc bo (vi pham CIS-9.2)
}
interface ethernet-1/1 {
    admin-state enable
    subinterface 0 {
        ipv4 {
            address 10.0.1.2/30
        }
    }
}
interface ethernet-1/2 {
    admin-state enable
    subinterface 0 {
        ipv4 {
            address 10.0.11.1/30
        }
    }
}
interface ethernet-1/3 {
    admin-state enable
    subinterface 0 {
        ipv4 {
            address 10.0.12.1/30
        }
    }
}
interface mgmt0 {
    admin-state enable
    ! Dat CIS-6.1: co ACL
    ip access-list mgmt-in
}
! CIS-7.1: Khong co ip http server (dat)
! CIS-8.2: Khong co finger (dat)
! CIS-10.1: Khong co mat khau mac dinh (dat)
