! ============================================================
! GOLDEN CONFIG (mau) - leaf2 - Nokia SR Linux (access)
! Thiet bi CHUA hardening — co vi pham CIS
! ============================================================
system {
    host-name leaf2
    ! Vi pham CIS-1.1: telnet server con bat
    telnet server {
        admin-state enable
    }
    ! Dat CIS-1.2: SSH bat
    ssh server {
        admin-state enable
    }
    ! Dat CIS-4.2: co NTP
    ntp {
        server 172.20.20.2
    }
    ! Dat CIS-4.1: co syslog
    logging {
        remote-server 172.20.20.3
    }
    ! Vi pham CIS-2.1: dung community private
    snmp {
        community private
    }
    ! Dat CIS-9.2: co log file
    log file /var/log/srlinux/messages
    ! Thieu banner (vi pham CIS-3.1)
    ! Thieu SNMPv3 (vi pham CIS-2.2)
    ! Thieu idle-timeout (vi pham CIS-8.1)
    ! Thieu password encryption (vi pham CIS-7.2)
    ! Thieu ACL (vi pham CIS-6.1)
}
interface ethernet-1/1 {
    admin-state enable
    subinterface 0 {
        ipv4 {
            address 10.0.12.2/30
        }
    }
}
interface ethernet-1/2 {
    admin-state enable
    subinterface 0 {
        ipv4 {
            address 10.0.22.2/30
        }
    }
}
interface mgmt0 {
    admin-state enable
}
! CIS-7.1: Khong co ip http server (dat)
! CIS-8.2: Khong co finger (dat)
! CIS-10.1: Khong co mat khau mac dinh (dat)
