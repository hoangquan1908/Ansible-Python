! ============================================================
! SAU HARDENING - leaf1 - Nokia SR Linux (access)
! Thiet bi DA duoc chuan hoa an ninh theo CIS Benchmark.
! Moi luat CIS deu dat -> diem 100%.
! ============================================================
system {
    host-name leaf1
    ! CIS-1.2: SSH bat
    ssh server {
        admin-state enable
        idle-timeout 300
    }
    ! CIS-4.2: NTP
    ntp {
        admin-state enable
        server 172.20.20.2
    }
    ! CIS-4.1 + CIS-9.2: Syslog + log buffer
    logging {
        remote-server 172.20.20.3
        buffer-size 4096
    }
    log file /var/log/srlinux/messages
    ! CIS-2.2: SNMPv3 auth-priv
    snmp {
        admin-state enable
        security-level auth-priv
    }
    ! CIS-3.1: Banner
    banner {
        login-banner "CANH BAO: He thong noi bo - Cam truy cap trai phep."
    }
    ! CIS-7.2: Password encrypted
    service password-encryption
    hashed-password enabled
}
interface ethernet-1/1 {
    admin-state enable
    subinterface 0 {
        ipv4 {
            address 10.0.11.2/30
        }
    }
}
interface mgmt0 {
    admin-state enable
    ! CIS-6.1: ACL quan tri
    acl {
        input mgmt-acl
    }
    ip access-list mgmt-in
}
! CIS-1.1: Khong co telnet (da xoa)
! CIS-2.1: Khong co community public/private
! CIS-7.1: Khong co ip http server
! CIS-8.2: Khong co finger
! CIS-10.1: Khong co mat khau mac dinh
