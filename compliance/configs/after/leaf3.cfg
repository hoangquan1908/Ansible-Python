! ============================================================
! SAU HARDENING - leaf3 - FRRouting (access)
! Thiet bi DA duoc chuan hoa an ninh theo CIS Benchmark.
! Moi luat CIS deu dat -> diem 100%.
! ============================================================
!
! CIS-11.1: Hostname
hostname leaf3
!
! CIS-7.2: Ma hoa mat khau
service password-encryption
!
! CIS-1.2: SSH + CIS-10.2: login local + CIS-8.1: exec-timeout
line vty
 transport input ssh
 login local
 exec-timeout 5 0
!
! CIS-3.1: Banner canh bao
banner motd ^CCanh bao: He thong noi bo, cam truy cap trai phep.^C
!
! CIS-4.1: Gui log ve syslog
log syslog informational
! CIS-9.2: Log cuc bo
log file /var/log/frr/frr.log
!
! CIS-4.2: NTP
ntp server 172.20.20.2
!
! CIS-2.2: SNMPv3 auth-priv
snmp-server group v3group v3 priv
snmp-server user v3admin v3group auth sha AuthK3y! priv aes EncK3y!
snmp-server view all-view .1 included
!
! CIS-6.1: ACL gioi han quan tri
access-list mgmt-in permit 172.20.20.0/24
access-list mgmt-in deny any
!
! CIS-5.1: Xac thuc BGP
router bgp 65103
 bgp router-id 10.255.0.23
 no bgp ebgp-requires-policy
 neighbor 10.0.23.1 remote-as 65020
 neighbor 10.0.23.1 password S3cur3BGP!
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
!
! CIS-9.1: Tat ip source-route
no ip source-route
!
interface eth1
 ip address 10.0.23.2/30
!
interface lo
 ip address 10.255.0.23/32
!
! CIS-1.1: Khong co telnet (da xoa)
! CIS-2.1: Khong co community public/private
! CIS-7.1: Khong co ip http server
! CIS-8.2: Khong co finger
! CIS-10.1: Khong co mat khau mac dinh
!
line vty
 access-class mgmt-in in
!
end
