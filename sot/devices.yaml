# =====================================================================
# NGUỒN DỮ LIỆU TIN CẬY (Source of Truth - SoT)
# ---------------------------------------------------------------------
# Đây là "hợp đồng dữ liệu" số 1 của nhóm. MỌI cấu hình thiết bị đều
# sinh ra từ file này (Chung dùng để render Jinja2), và công cụ chấm
# điểm của Quân đọc file này để biết có những thiết bị nào cần kiểm tra.
#
# Quy ước:
#   - name    : tên thiết bị (trùng tên file cấu hình: configs/live/<name>.cfg)
#   - os      : nền tảng -> quyết định bộ luật nào áp dụng (srlinux | frr)
#   - role    : vai trò trong sơ đồ mạng (leaf | spine | core | edge)
#   - mgmt_ip : IP quản trị (Ansible SSH vào đây)
#   - profile : nhóm luật hardening áp dụng (baseline | strict)
# =====================================================================

meta:
  ten_de_tai: "Tự động hóa cấu hình và kiểm soát tuân thủ an ninh mạng"
  nhom: "Kỹ thuật hệ thống và mạng máy tính"
  phien_ban_sot: "0.1"

devices:
  - name: leaf1
    os: srlinux
    role: leaf
    mgmt_ip: 172.20.20.11
    profile: baseline

  - name: core1
    os: frr
    role: core
    mgmt_ip: 172.20.20.12
    profile: strict

# Các thông số chung dùng chung toàn hệ thống (dịch vụ hợp lệ, dải NTP...)
policy_inputs:
  ntp_servers:
    - 172.20.20.2
  syslog_servers:
    - 172.20.20.3
  allowed_mgmt_cidr: "172.20.20.0/24"
