---
# Role hardening (Tung) — chuan hoa an ninh theo CIS Benchmark
# Moi task tuong ung voi mot hoac nhieu luat trong compliance/policy/cis_rules.yaml.
- name: "[harden] Chuan hoa an ninh cho SR Linux"
  ansible.builtin.include_tasks: srlinux.yml
  when: "'srlinux' in group_names"

- name: "[harden] Chuan hoa an ninh cho FRR"
  ansible.builtin.include_tasks: frr.yml
  when: "'frr' in group_names"
