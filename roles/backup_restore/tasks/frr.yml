---
# backup_restore — sao luu cau hinh FRRouting

- name: "[backup/frr] Lay running-config tu vtysh"
  ansible.builtin.shell: vtysh -c "show running-config"
  register: frr_running_config
  changed_when: false

- name: "[backup/frr] Luu cau hinh ra file backup"
  ansible.builtin.copy:
    content: "{{ frr_running_config.stdout }}"
    dest: "{{ playbook_dir }}/{{ backup_dir }}/{{ inventory_hostname }}.cfg"
    mode: "0644"
  delegate_to: localhost

- name: "[backup/frr] Xuat vao compliance/configs/live"
  ansible.builtin.copy:
    content: "{{ frr_running_config.stdout }}"
    dest: "{{ playbook_dir }}/{{ compliance_configs_dir }}/{{ inventory_hostname }}.cfg"
    mode: "0644"
  delegate_to: localhost

- name: "[restore/frr] Khoi phuc cau hinh tu ban sao luu"
  ansible.builtin.shell: |
    cp {{ playbook_dir }}/{{ backup_dir }}/{{ inventory_hostname }}.cfg /etc/frr/frr.conf
    /usr/lib/frr/frrinit.sh restart
  when: do_rollback | default(false)
