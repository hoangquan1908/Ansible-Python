---
# Role backup_restore — KB-04: sao luu running-config va rollback
- name: "[backup] Tao thu muc sao luu"
  ansible.builtin.file:
    path: "{{ playbook_dir }}/{{ backup_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  run_once: true

- name: "[backup] Sao luu SR Linux"
  ansible.builtin.include_tasks: srlinux.yml
  when: "'srlinux' in group_names"

- name: "[backup] Sao luu FRR"
  ansible.builtin.include_tasks: frr.yml
  when: "'frr' in group_names"
