---
# Role base_config — KB-01: cau hinh nen tang (hostname, NTP, syslog, banner)
# Phan luong theo nen tang thiet bi de goi dung module.
- name: "[base] Cau hinh nen tang cho SR Linux"
  ansible.builtin.include_tasks: srlinux.yml
  when: "'srlinux' in group_names"

- name: "[base] Cau hinh nen tang cho FRR"
  ansible.builtin.include_tasks: frr.yml
  when: "'frr' in group_names"
