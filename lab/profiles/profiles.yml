# =====================================================================
# KICH BAN CAU HINH CHO scripts/profile_lab.py (6 thiet bi: 2 FRR, 4 SR Linux)
# ---------------------------------------------------------------------
# Moi kich ban mo ta cac vi pham (hoac bien phap tu lam bang tay) duoc dua
# vao thiet bi SAU khi deploy, truoc khi cham diem "truoc" va chay harden.
#   frr          : danh sach lenh vtysh trong che do "configure terminal"
#   srl_delete   : duong dan SR Linux can xoa (nokia.srlinux.config delete)
#   srl_update   : {path, value} can ghi (nokia.srlinux.config update)
#   harden_first : true = harden truoc, roi moi dua thay doi vao (mo phong troi cau hinh)
#   repeat       : so lan chay lai kich ban (moi lan dung lab moi)
# Gia tri mat khau trong kich ban la mat khau YEU co chu dich, chi dung trong lab.
# =====================================================================
profiles:
  K1:
    title: "Chuẩn sau deploy"
    desc: "Không đưa thêm thay đổi nào"
    frr: []
    srl_delete: []
    srl_update: []

  K2:
    title: "Lỏng lẻo toàn mạng"
    desc: "FRR: mật khẩu vty mặc định, tắt syslog và log file; SR Linux: xóa banner, máy chủ NTP, máy chủ syslog"
    repeat: 3
    frr:
      - "no service password-encryption"
      - "password admin"
      - "no log syslog"
      - "no log file"
    srl_delete:
      - "/system/banner/login-banner"
      - "/system/ntp/server[address=172.20.20.2]"
      - "/system/logging/remote-server[host=172.20.20.3]"
    srl_update: []

  K3:
    title: "Lỏng lẻo chỉ trên FRR"
    desc: "Như K2 nhưng chỉ áp dụng cho 2 thiết bị FRR"
    frr:
      - "no service password-encryption"
      - "password admin"
      - "no log syslog"
      - "no log file"
    srl_delete: []
    srl_update: []

  K4:
    title: "Lỏng lẻo chỉ trên SR Linux"
    desc: "Như K2 nhưng chỉ áp dụng cho 4 thiết bị SR Linux"
    frr: []
    srl_delete:
      - "/system/banner/login-banner"
      - "/system/ntp/server[address=172.20.20.2]"
      - "/system/logging/remote-server[host=172.20.20.3]"
    srl_update: []

  K5:
    title: "Đã bảo mật một phần bằng tay"
    desc: "FRR: bật mã hóa mật khẩu, banner motd, exec-timeout; SR Linux: tắt JSON-RPC HTTP (giữ HTTPS), xóa nhóm SNMPv2 mặc định, đặt idle-timeout 600 s"
    frr:
      - "service password-encryption"
      - "banner motd line CANH BAO: he thong noi bo - cam truy cap trai phep"
      - "line vty"
      - "exec-timeout 5 0"
    srl_delete:
      - "/system/snmp/access-group[name=SNMPv2-RO-Community]"
    srl_update:
      - path: "/system/json-rpc-server/network-instance[name=mgmt]/http"
        value: {admin-state: disable}
      - path: "/system/aaa/authentication"
        value: {idle-timeout: 600}

  K6:
    title: "Trôi cấu hình sau harden"
    desc: "Harden xong, sau đó FRR: xóa ACL quản trị, tắt mã hóa mật khẩu, bỏ exec-timeout; SR Linux: xóa ACL quản trị, timeout SSH, banner"
    harden_first: true
    frr:
      - "no access-list mgmt-in"
      - "no service password-encryption"
      - "line vty"
      - "no exec-timeout"
    srl_delete:
      - "/acl/acl-filter[name=mgmt-acl][type=ipv4]"
      - "/system/ssh-server[name=mgmt]/timeout"
      - "/system/banner/login-banner"
    srl_update: []
