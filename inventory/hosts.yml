# TU SINH tu sot/devices.yaml v2.0 — DUNG sua tay, sua o SoT roi chay lai.
all:
  children:
    srlinux:
      hosts:
        spine1:
          ansible_host: 172.20.20.11
          device_role: spine
          hardening_profile: strict
          loopback_ip: 10.255.0.11
          device_interfaces:
            - name: ethernet-1/1
              description: "Uplink to edge1"
              ipv4: 10.0.1.2/30
            - name: ethernet-1/2
              description: "Downlink to leaf1"
              ipv4: 10.0.11.1/30
            - name: ethernet-1/3
              description: "Downlink to leaf2"
              ipv4: 10.0.12.1/30
          device_bgp:
            asn: 65010
            router_id: 10.255.0.11
            neighbors:
              - address: 10.0.1.1
                remote_as: 65000
                description: "eBGP to edge1"
              - address: 10.0.11.2
                remote_as: 65101
                description: "eBGP to leaf1"
              - address: 10.0.12.2
                remote_as: 65102
                description: "eBGP to leaf2"

        spine2:
          ansible_host: 172.20.20.12
          device_role: spine
          hardening_profile: strict
          loopback_ip: 10.255.0.12
          device_interfaces:
            - name: ethernet-1/1
              description: "Uplink to edge1"
              ipv4: 10.0.2.2/30
            - name: ethernet-1/2
              description: "Downlink to leaf2"
              ipv4: 10.0.22.1/30
            - name: ethernet-1/3
              description: "Downlink to leaf3"
              ipv4: 10.0.23.1/30
          device_bgp:
            asn: 65020
            router_id: 10.255.0.12
            neighbors:
              - address: 10.0.2.1
                remote_as: 65000
                description: "eBGP to edge1"
              - address: 10.0.22.2
                remote_as: 65102
                description: "eBGP to leaf2"
              - address: 10.0.23.2
                remote_as: 65103
                description: "eBGP to leaf3"

        leaf1:
          ansible_host: 172.20.20.21
          device_role: leaf
          hardening_profile: baseline
          loopback_ip: 10.255.0.21
          device_interfaces:
            - name: ethernet-1/1
              description: "Uplink to spine1"
              ipv4: 10.0.11.2/30
          device_bgp:
            asn: 65101
            router_id: 10.255.0.21
            neighbors:
              - address: 10.0.11.1
                remote_as: 65010
                description: "eBGP to spine1"

        leaf2:
          ansible_host: 172.20.20.22
          device_role: leaf
          hardening_profile: baseline
          loopback_ip: 10.255.0.22
          device_interfaces:
            - name: ethernet-1/1
              description: "Uplink to spine1"
              ipv4: 10.0.12.2/30
            - name: ethernet-1/2
              description: "Uplink to spine2"
              ipv4: 10.0.22.2/30
          device_bgp:
            asn: 65102
            router_id: 10.255.0.22
            neighbors:
              - address: 10.0.12.1
                remote_as: 65010
                description: "eBGP to spine1"
              - address: 10.0.22.1
                remote_as: 65020
                description: "eBGP to spine2"

    frr:
      hosts:
        edge1:
          ansible_host: 172.20.20.10
          device_role: edge
          hardening_profile: strict
          loopback_ip: 10.255.0.1
          device_interfaces:
            - name: eth1
              description: "Downlink to spine1"
              ipv4: 10.0.1.1/30
            - name: eth2
              description: "Downlink to spine2"
              ipv4: 10.0.2.1/30
          device_bgp:
            asn: 65000
            router_id: 10.255.0.1
            neighbors:
              - address: 10.0.1.2
                remote_as: 65010
                description: "eBGP to spine1"
              - address: 10.0.2.2
                remote_as: 65020
                description: "eBGP to spine2"

        leaf3:
          ansible_host: 172.20.20.23
          device_role: leaf
          hardening_profile: baseline
          loopback_ip: 10.255.0.23
          device_interfaces:
            - name: eth1
              description: "Uplink to spine2"
              ipv4: 10.0.23.2/30
          device_bgp:
            asn: 65103
            router_id: 10.255.0.23
            neighbors:
              - address: 10.0.23.1
                remote_as: 65020
                description: "eBGP to spine2"
