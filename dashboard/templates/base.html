<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Dashboard{% endblock %} — NetSecOps</title>
<style>
:root {
  --bg: #0f172a; --fg: #e2e8f0; --muted: #94a3b8; --line: #1e293b;
  --card: #1e293b; --card-hover: #334155; --accent: #3b82f6;
  --green: #22c55e; --yellow: #eab308; --red: #ef4444; --orange: #f97316;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* NAV */
.nav { background: #020617; border-bottom: 1px solid var(--line); padding: 0 24px; display: flex; align-items: center; height: 56px; gap: 32px; }
.nav-brand { font-weight: 800; font-size: 18px; color: var(--accent); }
.nav-links { display: flex; gap: 4px; }
.nav-links a { padding: 8px 16px; border-radius: 8px; color: var(--muted); font-size: 14px; font-weight: 500; }
.nav-links a:hover, .nav-links a.active { background: var(--card); color: var(--fg); text-decoration: none; }

/* LAYOUT */
.container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 768px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }

/* CARDS */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.card:hover { border-color: #334155; }
.card-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }

/* STAT */
.stat-value { font-size: 36px; font-weight: 800; line-height: 1.1; }
.stat-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
.score-high { color: var(--green); }
.score-mid { color: var(--yellow); }
.score-low { color: var(--red); }

/* TABLE */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; padding: 10px 12px; color: var(--muted); font-weight: 600; border-bottom: 2px solid var(--line); }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); }
tr:hover td { background: rgba(59,130,246,0.04); }
.badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; }
.badge-ok { background: rgba(34,197,94,0.15); color: var(--green); }
.badge-fail { background: rgba(239,68,68,0.15); color: var(--red); }
.badge-warn { background: rgba(234,179,8,0.15); color: var(--yellow); }
.badge-os { background: rgba(59,130,246,0.15); color: var(--accent); }

/* BUTTON */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.15s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #2563eb; }
.btn-secondary { background: var(--card); color: var(--fg); border: 1px solid var(--line); }
.btn-secondary:hover { background: var(--card-hover); }

/* PROGRESS BAR */
.progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress-bar { height: 100%; border-radius: 99px; transition: width 0.5s ease; }

/* CHART placeholder */
.chart-bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding-top: 8px; }
.chart-bar { flex: 1; border-radius: 4px 4px 0 0; position: relative; transition: height 0.3s; min-width: 20px; }
.chart-bar:hover { opacity: 0.8; }
.chart-label { text-align: center; font-size: 11px; color: var(--muted); margin-top: 4px; }

h1 { font-size: 24px; margin-bottom: 4px; }
h2 { font-size: 18px; margin-bottom: 12px; }
.page-sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

.hidden { display: none; }
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-brand">NetSecOps</div>
  <div class="nav-links">
    <a href="/" class="{% if request.path == '/' %}active{% endif %}">Tong quan</a>
    <a href="/devices" class="{% if request.path == '/devices' %}active{% endif %}">Thiet bi</a>
    <a href="/topology" class="{% if request.path == '/topology' %}active{% endif %}">Topology</a>
  </div>
</nav>
<div class="container">
{% block content %}{% endblock %}
</div>
<script>
function scoreColor(s) { return s >= 90 ? 'var(--green)' : s >= 70 ? 'var(--yellow)' : 'var(--red)'; }
function scoreClass(s) { return s >= 90 ? 'score-high' : s >= 70 ? 'score-mid' : 'score-low'; }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
