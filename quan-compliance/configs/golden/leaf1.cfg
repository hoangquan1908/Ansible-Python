! ============================================================
! GOLDEN CONFIG (mẫu để test) - leaf1 - Nokia SR Linux
! Thiết bị CHƯA hardening đầy đủ -> dùng để chứng minh công cụ
! phát hiện được vi phạm. Sau này Chung sinh config thật thay vào.
! ============================================================
system {
    host-name leaf1
    ! Vi phạm CIS-1.1: telnet server còn bật
    telnet server {
        admin-state enable
    }
    ssh server {
        admin-state enable
    }
    ntp {
        server 172.20.20.2
    }
    logging {
        remote-server 172.20.20.3
    }
    ! Vi phạm CIS-2.1: dùng community public
    snmp {
        community public
    }
    ! Thiếu banner (vi phạm CIS-3.1)
    ! Thiếu SNMPv3 (vi phạm CIS-2.2)
}
interface mgmt0 {
    admin-state enable
    ! có ACL quản trị
    ip access-list mgmt-in
}
