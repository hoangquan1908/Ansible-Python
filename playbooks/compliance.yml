---
# Quan — thu thap cau hinh thuc te va cham diem tuan thu
# Chay: ansible-playbook -i inventory/hosts.yml playbooks/compliance.yml
- name: "Thu thap cau hinh hien tai tu thiet bi"
  hosts: all
  gather_facts: false
  collections:
    - nokia.srlinux
  roles:
    - backup_restore

- name: "Cham diem tuan thu an ninh (CIS Benchmark)"
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: "[compliance] Chay cong cu cham diem"
      ansible.builtin.command:
        cmd: >
          python3 {{ playbook_dir }}/../compliance/tools/score.py
          --sot {{ playbook_dir }}/../sot/devices.yaml
          --policy {{ playbook_dir }}/../compliance/policy/cis_rules.yaml
          --configs {{ playbook_dir }}/../compliance/configs/live
      register: score_result
      changed_when: false

    - name: "[compliance] Ket qua"
      ansible.builtin.debug:
        msg: "{{ score_result.stdout }}"
